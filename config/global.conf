# path: config/global.conf
#--- Global Configuration ---#

# Core 
AUTO_UPDATE=no
INSTALL_DOCKER=yes
ENABLE_SECURITY=yes

# Host  (optional)
HOSTNAME=example-host

# SSH / Firewall (optional)
SSH_PORT=4532
OPEN_PORTS="80 443 8080/tcp 53/udp"
DISABLE_ROOT_SSH=yes

# User (optional)
USER_NAME=admin
USER_PASSWORD=change-me

# Swap (optional)
SWAP_ENABLED=yes
SWAP_MULTIPLIER=1
SWAP_SWAPPINESS=10

# 2FA (optional)
ENABLE_2FA=no

# Fail2Ban (optional)
FAIL2BAN_DESTEMAIL=security@example.com
FAIL2BAN_SENDER=noreply@example.com
FAIL2BAN_MTA=sendmail
FAIL2BAN_ACTION="%(action_mwl)s"


# MSMTP (optional)
SMTP_HOST=smtp.example.com
SMTP_PORT=587
SMTP_FROM=noreply@example.com
SMTP_USER=noreply@example.com
SMTP_PASSWORD=change-me
SMTP_LOGFILE=/var/log/msmtp/msmtp.log

# Dockge (optional)
DOCKGE_PORT=5001
DOCKGE_STACKS_DIR=/opt/stacks
DOCKGE_DATA_DIR=/opt/dockge
DOCKGE_VOLUMES_DIR=/opt/volumes

# Backup (optional)
BACKUP_ENABLED=no
BACKUP_SOURCE_DIR=/opt
BACKUP_REPO=/var/backups/restic
BACKUP_PASSWORD=change-me
BACKUP_KEEP=7
BACKUP_RCLONE_REMOTE=gdrive
BACKUP_RCLONE_PATH=server-kit

# Restore (optional)
RESTORE_ENABLED=no
RESTORE_TAR_PATH=/var/backups/opt-backup.tar.gz
RESTORE_TARGET_DIR=/opt
