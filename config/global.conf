# path: config/global.conf
#--- Global Configuration ---#

# Global defaults (applies across modules)
DEBIAN_NONINTERACTIVE=yes
ENABLE_SECURITY=yes
INSTALL_DOCKER=yes

# Core module (system_update/useful_packages)
AUTO_UPDATE=no

# Identity and host module (user/hostname)
USER_NAME=admin
USER_PASSWORD=change-me
HOSTNAME=example-host

# Mail module (mail_sender)
SMTP_HOST=smtp.example.com
SMTP_PORT=587
SMTP_FROM=noreply@example.com
SMTP_USER=noreply@example.com
SMTP_PASSWORD=change-me
SMTP_LOGFILE=/var/log/msmtp/msmtp.log

# Access module (ssh)
SSH_PORT=4532
DISABLE_ROOT_SSH=yes

# Swap module (swap)
SWAP_ENABLED=yes
SWAP_MULTIPLIER=1
SWAP_SWAPPINESS=10

# Firewall module (ufw)
OPEN_PORTS="80 443 8080/tcp 53/udp"

# Fail2Ban module (fail2ban)
FAIL2BAN_DESTEMAIL=security@example.com
FAIL2BAN_SENDER=noreply@example.com
FAIL2BAN_MTA=sendmail
FAIL2BAN_ACTION="%(action_mwl)s"

# Two-factor auth module (google_authenticator)
ENABLE_2FA=no

# Containers modules (docker/dockge)
DOCKGE_PORT=5001
DOCKGE_STACKS_DIR=/opt/stacks
DOCKGE_DATA_DIR=/opt/dockge
DOCKGE_VOLUMES_DIR=/opt/volumes

# Backup (backup)
BACKUP_ENABLED=no
BACKUP_SOURCE_DIR=/opt
BACKUP_PASSWORD=change-me
BACKUP_REPO=/var/backups/restic
BACKUP_KEEP=7
BACKUP_RCLONE_REMOTE=gdrive
BACKUP_RCLONE_PATH=backup/domain.srv
RCLONE_CONFIG_PATH=/root/.config/rclone/rclone.conf

# Restore (restore)
RESTORE_ENABLED=no
RESTORE_TARGET_DIR=/opt
RESTORE_SNAPSHOT=latest
RESTORE_REPO=rclone:gdrive:backup/domain.srv
RESTORE_PASSWORD=change-me
RESTORE_RCLONE_CONFIG_PATH=/root/.config/rclone/rclone.conf
